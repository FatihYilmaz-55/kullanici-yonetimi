<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kullanıcı Yönetimi</title>
  <style>
    body {  
      background-color: whitesmoke;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #mainContainer {
      display: flex;
      gap: 20px;
      max-width: 900px;
      margin: 70px auto 0 auto;
      justify-content: center;
      align-items: flex-start;
    }
    .editBtn, 
    .deleteBtn{
      cursor: pointer;
    }
    #userTable {  
      background: white;
      width: 100%;
      border-collapse: collapse;
      border: none;
      font-size: 16px;
      min-width: 400px;
    }
    #userTable th,
    #userTable td {
      padding: 3px 15px;
      text-align: left;
      font-size: 15px;
    }
    td.action-cell {
      background-color: whitesmoke;
      border: none !important;
    }
    #userTable th.action-header {
      background-color: whitesmoke;
      border: none;
    }
    #tableContainer {
      flex: 1;
    }
    #kullaniciGiris {
      width: 40%;
      background-color: white;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none; 
    }
    #kullaniciGiris h2 {
      margin-top: 0;
    }
    #kullaniciGiris input[type="text"],
    #kullaniciGiris input[type="email"] {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    #kullaniciGiris button[type="submit"],
    #kullaniciGiris button#cancelEdit {
      padding: 8px 15px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
      border: none;
      border-radius: 3px;
    }
    #kullaniciGiris button[type="submit"] {
      background-color: #28a745;
      color: white;
    }
    #kullaniciGiris button[type="submit"]:hover {
      background-color: #218838;
    }
    #kullaniciGiris button#cancelEdit {
      background-color: #dc3545;
      color: white;
    }
    #kullaniciGiris button#cancelEdit:hover {
      background-color: #c82333;
    }
    #showAddUserBtnContainer {
      margin-top: 20px;
      text-align: center;
    }
    #kullaniciGirisiGoster {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    #kullaniciGirisiGoster:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div id="mainContainer">
    <div id="tableContainer">
      <h2 class="listOfUsers">Kullanıcı Listesi</h2>
      <table border="1" id="userTable">
        <thead>
          <tr>
            <th>Ad</th>
            <th>Soyad</th>
            <th>Email</th>
            <th>Oluşturulma Tarihi</th>
            <th class="action-header"></th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
      <div id="showAddUserBtnContainer">
        <button id="kullaniciGirisiGoster">Yeni Kullanıcı Oluştur</button>
      </div>
    </div>

    <div id="kullaniciGiris">
      <h2 class="newUser">Yeni Kullanıcı Ekle</h2>
      <form id="addUserForm">
        <input type="text" id="firstName" name="firstName" placeholder="First Name" required />
        <input type="text" id="lastName" name="lastName" placeholder="Last Name" required />
        <input type="email" id="email" name="email" placeholder="Email" required />
        <div>
          <button type="submit">Ekle</button>
          <button type="button" id="cancelEdit">İptal</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('addUserForm');
  const userTableBody = document.getElementById('userTableBody');
  const formContainer = document.getElementById('kullaniciGiris');
  const showFormBtn = document.getElementById('kullaniciGirisiGoster');
  const newUserTitle = document.querySelector('.newUser');

  let users = [];

  async function fetchUsers() {
    try {
      const response = await fetch("http://localhost:5000/users");
      users = await response.json();

      renderTable();
    } catch (error) {
      alert('Kullanıcıları alırken hata oluştu: ' + error.message);
    }
  }

  function renderTable() {
    userTableBody.innerHTML = "";

    users.forEach(user => {
      const dateObj = new Date(user.created_at);
      const formattedDate = dateObj.toLocaleString('tr-TR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric',
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "UTC"
      });
      users.forEach(user => {
        console.log(`ID: ${user.id}, Created At: ${user.created_at}`);  
      });

      const row = document.createElement("tr");
      // Template literal için tırnak işaretlerini düzelttim ve <td> elementlerini string içine aldım
      row.innerHTML = `
        <td>${user.firstName}</td>
        <td>${user.lastName}</td>
        <td>${user.email}</td>
        <td>${formattedDate}</td>
        <td class="action-cell">
          <button class="editBtn" data-id="${user.id}" title="Düzenle">✏️</button>
          <button class="deleteBtn" data-id="${user.id}" title="Sil">🗑️</button>
        </td>
      `;
      userTableBody.appendChild(row);
      users.forEach(user => {
        console.log(`ID: ${user.id}, Created At: ${user.created_at}`);  
      });
    });

    addEditListeners();
    addDeleteListeners();
    
  }

  function addEditListeners(){
    userTableBody.querySelectorAll(".editBtn").forEach(button => {
      button.addEventListener("click", (e) => {
        const userId = e.target.getAttribute("data-id");
        const user = users.find(u => u.id == userId);
        if (!user){
          alert("Kullanıcı bulunamadı.");
          return;
        }
        form.firstName.value = user.firstName;
        form.lastName.value = user.lastName;
        form.email.value = user.email;

        form.dataset.editingUserId = userId;

        openForm();
        newUserTitle.textContent = "Kullanıcıyı Düzenle";
        form.querySelector('button[type="submit"]').textContent = "Güncelle";
      });
    });
  }

  function addDeleteListeners(){
    userTableBody.querySelectorAll(".deleteBtn").forEach(button => {
      button.addEventListener("click", async (e) => {
        const userId = e.target.getAttribute("data-id");
        if (!confirm("Bu kullanıcıyı silmek istediğinden emin misin?")) return;

        try {
          const response = await fetch(`http://localhost:5000/users/${userId}`, {method:"DELETE"});
          const result = await response.json();

          if(response.ok){
            alert(result.message);
            await fetchUsers();
          } else {
            alert("HATA: " + (result.error || "Bilinmeyen hata"));
          }
        } catch (error){
          alert('İstek sırasında hata oluştu: ' + error.message);
        }
      });
    });
  }

  function openForm(){
    formContainer.style.display = 'block';
    showFormBtn.style.display = 'none';
  }

  function closeForm(){
    form.reset();
    formContainer.style.display = 'none';
    showFormBtn.style.display = 'inline-block';
    newUserTitle.textContent = "Yeni Kullanıcı Ekle";
    form.querySelector('button[type="submit"]').textContent = "Ekle";
    delete form.dataset.editingUserId;
  }

  showFormBtn.addEventListener('click', () => {
    openForm();
    form.reset();
    newUserTitle.textContent = "Yeni Kullanıcı Ekle";
    form.querySelector('button[type="submit"]').textContent = "Ekle";
    delete form.dataset.editingUserId;
  });

  document.getElementById('cancelEdit').addEventListener('click', () => {
    closeForm();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    
    const firstName = form.firstName.value.trim();
    const lastName = form.lastName.value.trim();
    const email = form.email.value.trim();
    const data = { firstName, lastName, email};
    

    const nameRegex = /^[A-Za-zÇçĞğİıÖöŞşÜü]+$/;
    if (!nameRegex.test(firstName)|| !nameRegex.test(lastName)) {
      alert("Ad ve soyad sadece harf içermelidir.")
      return;
    }
    
    if (firstName.length < 2 || lastName.length < 2){
      alert("Ad ve soyad bir harften uzun olmalıdır.");
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if (!emailRegex.test(email)) {
      alert("Geçerli bir e-posta adresi girin. Örn: isim@site.com");
      return;
    }

    const userId = form.dataset.editingUserId;
    try {
      let response;
      if (userId){
        response = await fetch(`http://localhost:5000/users/${userId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
      } else {
        response = await fetch('http://localhost:5000/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
      }

      const result = await response.json();
      if (response.ok) {
        alert(userId ? "Kullanıcı başarıyla güncellendi!" : "Kullanıcı başarıyla eklendi!");
        closeForm();
        await fetchUsers(); 
      } else {
        alert('Hata: ' + (result.error || 'Bilinmeyen hata'));
      }
    } catch (err) {
      alert('İstek sırasında hata oluştu: ' + err.message);
    }
  });

  window.onload = fetchUsers;
</script>

</body>
</html>
